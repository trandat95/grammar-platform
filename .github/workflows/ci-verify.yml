name: Free-Tier CI Verification Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-platform:
    name: Security, Engine & Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Engine, Design Token & Security Validation Suites
        run: |
          python scripts/validate-design-tokens.py
          python scripts/validate-mastery-engine.py
          python scripts/validate-gamification-engine.py
          python scripts/validate-monetization-engine.py
          python scripts/validate-milestone-211.py

      - name: Install dependencies (Next.js / Prisma)
        run: npm install --no-audit --no-fund

      - name: Verify Production Next.js Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://wtvlbbcyvtqqygtojxay.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-build-anon-key' }}
        run: npm run build
