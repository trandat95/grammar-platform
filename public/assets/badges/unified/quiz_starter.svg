<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Người Chinh Phục Quiz">
  <defs>
    <linearGradient id="rim-quiz_starter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <radialGradient id="enamel-quiz_starter" cx="42%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="cyan-quiz_starter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="55%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="amber-quiz_starter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Unified Concept A Medallion Frame (Transparent Outer Canvas) -->
  <circle cx="80" cy="80" r="68" fill="url(#rim-quiz_starter)"/>
  <circle cx="80" cy="80" r="61" fill="#0f172a"/>
  <circle cx="80" cy="80" r="57" fill="url(#enamel-quiz_starter)"/>
  <circle cx="80" cy="80" r="51" fill="none" stroke="#fb923c" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Top Soft Rim Specular Arc -->
  <path d="M36 52 A56 56 0 0 1 124 52" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Center Geometric Motif -->
  <g transform="translate(80, 80)">
    
      <rect x="-22" y="-26" width="44" height="52" rx="8" fill="#f8fafc" stroke="url(#amber-quiz_starter)" stroke-width="2.5"/>
      <line x1="-12" y1="-10" x2="12" y2="-10" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
      <line x1="-12" y1="2" x2="12" y2="2" stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="-12" y1="14" x2="4" y2="14" stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="18" cy="18" r="11" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
      <path d="M13 18 L16.5 21.5 L23 14.5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
  </g>

  
  <circle cx="38" cy="40" r="2" fill="#fdba74" fill-opacity="0.85"/>
  <circle cx="122" cy="120" r="2" fill="#fdba74" fill-opacity="0.7"/>
</svg>