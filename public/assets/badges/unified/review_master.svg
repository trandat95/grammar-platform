<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Bậc Thầy Ôn Tập Ngắt Quãng">
  <defs>
    <linearGradient id="rim-review_master" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="enamel-review_master" cx="42%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="cyan-review_master" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="55%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="amber-review_master" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Unified Concept A Medallion Frame (Transparent Outer Canvas) -->
  <circle cx="80" cy="80" r="68" fill="url(#rim-review_master)"/>
  <circle cx="80" cy="80" r="61" fill="#0f172a"/>
  <circle cx="80" cy="80" r="57" fill="url(#enamel-review_master)"/>
  <circle cx="80" cy="80" r="51" fill="none" stroke="#fde047" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Top Soft Rim Specular Arc -->
  <path d="M36 52 A56 56 0 0 1 124 52" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Center Geometric Motif -->
  <g transform="translate(80, 80)">
    
      <line x1="-18" y1="-12" x2="18" y2="-12" stroke="#67e8f9" stroke-width="3"/>
      <line x1="-18" y1="-12" x2="0" y2="18" stroke="#67e8f9" stroke-width="3"/>
      <line x1="18" y1="-12" x2="0" y2="18" stroke="#67e8f9" stroke-width="3"/>
      <circle cx="-18" cy="-12" r="9" fill="url(#cyan-review_master)" stroke="#ffffff" stroke-width="2"/>
      <circle cx="18" cy="-12" r="9" fill="url(#amber-review_master)" stroke="#fef9c3" stroke-width="2"/>
      <circle cx="0" cy="18" r="10" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
    
  </g>

  
  <circle cx="38" cy="40" r="2" fill="#fef08a" fill-opacity="0.85"/>
  <circle cx="122" cy="120" r="2" fill="#fef08a" fill-opacity="0.7"/>
</svg>