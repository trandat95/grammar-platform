<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Câu Lạc Bộ 100 Đề">
  <defs>
    <linearGradient id="rim-century_club" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="enamel-century_club" cx="42%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="cyan-century_club" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="55%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="amber-century_club" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Unified Concept A Medallion Frame (Transparent Outer Canvas) -->
  <circle cx="80" cy="80" r="68" fill="url(#rim-century_club)"/>
  <circle cx="80" cy="80" r="61" fill="#0f172a"/>
  <circle cx="80" cy="80" r="57" fill="url(#enamel-century_club)"/>
  <circle cx="80" cy="80" r="51" fill="none" stroke="#fde047" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Top Soft Rim Specular Arc -->
  <path d="M36 52 A56 56 0 0 1 124 52" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Center Geometric Motif -->
  <g transform="translate(80, 80)">
    
      <path d="M-26 14 C-34 0, -28 -18, -14 -26" fill="none" stroke="url(#amber-century_club)" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M26 14 C34 0, 28 -18, 14 -26" fill="none" stroke="url(#amber-century_club)" stroke-width="4.5" stroke-linecap="round"/>
      <rect x="-22" y="-14" width="44" height="28" rx="9" fill="#0f172a" stroke="url(#cyan-century_club)" stroke-width="2.5"/>
      <text x="0" y="6" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#fef08a">100</text>
    
  </g>

  
  <circle cx="38" cy="40" r="2" fill="#fef08a" fill-opacity="0.85"/>
  <circle cx="122" cy="120" r="2" fill="#fef08a" fill-opacity="0.7"/>
</svg>