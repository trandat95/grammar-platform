<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Chuyên Gia Mệnh Đề &amp; Điều Kiện">
  <defs>
    <linearGradient id="rim-conditional_expert" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <radialGradient id="enamel-conditional_expert" cx="42%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="cyan-conditional_expert" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="55%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="amber-conditional_expert" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Unified Concept A Medallion Frame (Transparent Outer Canvas) -->
  <circle cx="80" cy="80" r="68" fill="url(#rim-conditional_expert)"/>
  <circle cx="80" cy="80" r="61" fill="#0f172a"/>
  <circle cx="80" cy="80" r="57" fill="url(#enamel-conditional_expert)"/>
  <circle cx="80" cy="80" r="51" fill="none" stroke="#67e8f9" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Top Soft Rim Specular Arc -->
  <path d="M36 52 A56 56 0 0 1 124 52" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Center Geometric Motif -->
  <g transform="translate(80, 80)">
    
      <path d="M0 30 V4 C0 -6, -18 -10, -18 -24" fill="none" stroke="url(#cyan-conditional_expert)" stroke-width="6" stroke-linecap="round"/>
      <path d="M0 4 C0 -6, 18 -10, 18 -24" fill="none" stroke="url(#amber-conditional_expert)" stroke-width="6" stroke-linecap="round"/>
      <polygon points="-18,-32 -26,-20 -10,-20" fill="#67e8f9"/>
      <polygon points="18,-32 10,-20 26,-20" fill="#fde68a"/>
      <circle cx="0" cy="28" r="6" fill="#2563eb" stroke="#e0f2fe" stroke-width="2"/>
    
  </g>

  
  <circle cx="38" cy="40" r="2" fill="#e0f2fe" fill-opacity="0.85"/>
  <circle cx="122" cy="120" r="2" fill="#e0f2fe" fill-opacity="0.7"/>
</svg>