      <path d="M0 -34 L3.5 -24.5 L13 -21 L3.5 -17.5 L0 -8 L-3.5 -17.5 L-13 -21 L-3.5 -24.5 Z" fill="url(#amber-knowledge_collector)" stroke="#ffffff" stroke-width="1"/>
    
