<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Kho Tàng Tri Thức 1,000 Câu">
  <defs>
    <linearGradient id="rim-knowledge_collector" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="enamel-knowledge_collector" cx="42%" cy="32%" r="68%">
