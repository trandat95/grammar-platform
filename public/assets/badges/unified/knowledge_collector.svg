  <!-- Unified Concept A Medallion Frame (Transparent Outer Canvas) -->
  <circle cx="80" cy="80" r="68" fill="url(#rim-knowledge_collector)"/>
  <circle cx="80" cy="80" r="61" fill="#0f172a"/>
  <circle cx="80" cy="80" r="57" fill="url(#enamel-knowledge_collector)"/>
  <circle cx="80" cy="80" r="51" fill="none" stroke="#67e8f9" stroke-opacity="0.45" stroke-width="1.5" />

