      <stop offset="100%" stop-color="#090f1e"/>
    </radialGradient>
    <linearGradient id="cyan-knowledge_collector" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
