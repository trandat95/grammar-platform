<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Vua Lội Ngược Dòng">
  <defs>
    <linearGradient id="rim-comeback_king" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <radialGradient id="enamel-comeback_king" cx="42%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="cyan-comeback_king" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="55%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="amber-comeback_king" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Unified Concept A Medallion Frame (Transparent Outer Canvas) -->
  <circle cx="80" cy="80" r="68" fill="url(#rim-comeback_king)"/>
  <circle cx="80" cy="80" r="61" fill="#0f172a"/>
  <circle cx="80" cy="80" r="57" fill="url(#enamel-comeback_king)"/>
  <circle cx="80" cy="80" r="51" fill="none" stroke="#67e8f9" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Top Soft Rim Specular Arc -->
  <path d="M36 52 A56 56 0 0 1 124 52" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Center Geometric Motif -->
  <g transform="translate(80, 80)">
    
      <path d="M-26 20 C-14 14, -4 6, 4 -12" fill="none" stroke="#67e8f9" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="5 5"/>
      <path d="M-24 22 L-4 4 L4 12 L24 -18" fill="none" stroke="url(#amber-comeback_king)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <polygon points="28,-24 12,-20 24,-8" fill="#fef08a"/>
    
  </g>

  
  <circle cx="38" cy="40" r="2" fill="#e0f2fe" fill-opacity="0.85"/>
  <circle cx="122" cy="120" r="2" fill="#e0f2fe" fill-opacity="0.7"/>
</svg>