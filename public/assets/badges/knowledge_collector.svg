<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Kho Tàng Tri Thức 1,000 Câu">
  <defs>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#67e8f9"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>
    <linearGradient id="rimReverse" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <radialGradient id="enamelBg" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>
    <radialGradient id="topSheen" cx="50%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
    <filter id="motifShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Clean studio soft backdrop matching card framing -->
  <rect width="256" height="256" rx="44" fill="#f8fafc"/>
  <circle cx="128" cy="128" r="106" fill="#22d3ee" opacity="0.14"/>
  <!-- Outer Ornate Scalloped / Medallion Rim -->
  <g filter="url(#drop)">
    <polygon points="128,16 154,28 184,26 202,50 226,68 228,98 240,128 228,158 226,188 202,206 184,230 154,228 128,240 102,228 72,230 54,206 30,188 28,158 16,128 28,98 30,68 54,50 72,26 102,28" fill="url(#rimGrad)" stroke="#0284c7" stroke-width="2.5"/>
    <circle cx="128" cy="128" r="95" fill="url(#rimReverse)"/>
    <circle cx="128" cy="128" r="87" fill="url(#enamelBg)" stroke="#ffffff" stroke-width="2"/>
    <!-- Inner filigree ring -->
    <circle cx="128" cy="128" r="78" fill="none" stroke="#67e8f9" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.7"/>
  </g>
  <!-- Sparkles -->
  <g fill="#ecfeff" opacity="0.9">
    <path d="M56 76 L58 83 L65 85 L58 87 L56 94 L54 87 L47 85 L54 83 Z"/>
    <path d="M196 66 L198 71 L203 73 L198 75 L196 80 L194 75 L189 73 L194 71 Z"/>
    <circle cx="66" cy="176" r="2.5"/>
    <circle cx="188" cy="182" r="2.5"/>
  </g>
  <!-- Motif Content -->
  <g filter="url(#motifShadow)">
    
  <!-- Open Scholar Tome -->
  <path d="M64 134 C88 126, 114 130, 128 144 C142 130, 168 126, 192 134 L186 180 C164 172, 142 174, 128 186 C114 174, 92 172, 70 180 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
  <line x1="128" y1="144" x2="128" y2="186" stroke="#0284c7" stroke-width="3"/>
  <!-- Faceted Floating Sapphire Diamond -->
  <polygon points="128,58 158,92 128,130 98,92" fill="#22d3ee" stroke="#ffffff" stroke-width="2.5"/>
  <polygon points="128,58 158,92 128,92" fill="#a5f3fc"/>
  <polygon points="128,58 98,92 128,92" fill="#67e8f9"/>
  <polygon points="128,130 158,92 128,92" fill="#06b6d4"/>
  <polygon points="128,130 98,92 128,92" fill="#0891b2"/>

  </g>
  <!-- Gloss Specular Overlay -->
  <ellipse cx="128" cy="84" rx="68" ry="40" fill="url(#topSheen)"/>
</svg>