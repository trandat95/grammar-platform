<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Bậc Thầy Ôn Tập Ngắt Quãng">
  <defs>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="30%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="rimReverse" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="50%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <radialGradient id="enamelBg" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <radialGradient id="topSheen" cx="50%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
    <filter id="motifShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Clean studio soft backdrop matching card framing -->
  <rect width="256" height="256" rx="44" fill="#f8fafc"/>
  <circle cx="128" cy="128" r="106" fill="#facc15" opacity="0.14"/>
  <!-- Outer Ornate Scalloped / Medallion Rim -->
  <g filter="url(#drop)">
    <polygon points="128,16 154,28 184,26 202,50 226,68 228,98 240,128 228,158 226,188 202,206 184,230 154,228 128,240 102,228 72,230 54,206 30,188 28,158 16,128 28,98 30,68 54,50 72,26 102,28" fill="url(#rimGrad)" stroke="#a16207" stroke-width="2.5"/>
    <circle cx="128" cy="128" r="95" fill="url(#rimReverse)"/>
    <circle cx="128" cy="128" r="87" fill="url(#enamelBg)" stroke="#fef9c3" stroke-width="2"/>
    <!-- Inner filigree ring -->
    <circle cx="128" cy="128" r="78" fill="none" stroke="#facc15" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.7"/>
  </g>
  <!-- Sparkles -->
  <g fill="#fef08a" opacity="0.9">
    <path d="M56 76 L58 83 L65 85 L58 87 L56 94 L54 87 L47 85 L54 83 Z"/>
    <path d="M196 66 L198 71 L203 73 L198 75 L196 80 L194 75 L189 73 L194 71 Z"/>
    <circle cx="66" cy="176" r="2.5"/>
    <circle cx="188" cy="182" r="2.5"/>
  </g>
  <!-- Motif Content -->
  <g filter="url(#motifShadow)">
    
  <!-- Golden Laurel Arc -->
  <path d="M72 152 C64 114, 82 78, 114 68" fill="none" stroke="url(#rimGrad)" stroke-width="7" stroke-linecap="round" stroke-dasharray="10 6"/>
  <path d="M184 152 C192 114, 174 78, 142 68" fill="none" stroke="url(#rimGrad)" stroke-width="7" stroke-linecap="round" stroke-dasharray="10 6"/>
  <!-- Sculpted Golden Brain Constellation -->
  <path d="M126 84 C102 84, 88 102, 90 124 C84 138, 92 158, 112 162 L126 162 Z" fill="url(#rimGrad)" stroke="#78350f" stroke-width="2"/>
  <path d="M130 84 C154 84, 168 102, 166 124 C172 138, 164 158, 144 162 L130 162 Z" fill="url(#rimReverse)" stroke="#78350f" stroke-width="2"/>
  <!-- Glowing Neural Nodes -->
  <circle cx="110" cy="112" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="146" cy="112" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="106" cy="140" r="5" fill="#34d399" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="150" cy="140" r="5" fill="#34d399" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="110" y1="112" x2="146" y2="112" stroke="#e0f2fe" stroke-width="2.5"/>
  <line x1="110" y1="112" x2="106" y2="140" stroke="#e0f2fe" stroke-width="2.5"/>
  <line x1="146" y1="112" x2="150" y2="140" stroke="#e0f2fe" stroke-width="2.5"/>

  </g>
  <!-- Gloss Specular Overlay -->
  <ellipse cx="128" cy="84" rx="68" ry="40" fill="url(#topSheen)"/>
</svg>