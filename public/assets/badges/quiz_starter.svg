<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Người Chinh Phục Quiz">
  <defs>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="30%" stop-color="#d97706"/>
      <stop offset="70%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="rimReverse" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="enamelBg" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>
    <radialGradient id="topSheen" cx="50%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
    <filter id="motifShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Clean studio soft backdrop matching card framing -->
  <rect width="256" height="256" rx="44" fill="#f8fafc"/>
  <circle cx="128" cy="128" r="106" fill="#f59e0b" opacity="0.14"/>
  <!-- Outer Ornate Scalloped / Medallion Rim -->
  <g filter="url(#drop)">
    <polygon points="128,16 154,28 184,26 202,50 226,68 228,98 240,128 228,158 226,188 202,206 184,230 154,228 128,240 102,228 72,230 54,206 30,188 28,158 16,128 28,98 30,68 54,50 72,26 102,28" fill="url(#rimGrad)" stroke="#92400e" stroke-width="2.5"/>
    <circle cx="128" cy="128" r="95" fill="url(#rimReverse)"/>
    <circle cx="128" cy="128" r="87" fill="url(#enamelBg)" stroke="#fde68a" stroke-width="2"/>
    <!-- Inner filigree ring -->
    <circle cx="128" cy="128" r="78" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.7"/>
  </g>
  <!-- Sparkles -->
  <g fill="#fef3c7" opacity="0.9">
    <path d="M56 76 L58 83 L65 85 L58 87 L56 94 L54 87 L47 85 L54 83 Z"/>
    <path d="M196 66 L198 71 L203 73 L198 75 L196 80 L194 75 L189 73 L194 71 Z"/>
    <circle cx="66" cy="176" r="2.5"/>
    <circle cx="188" cy="182" r="2.5"/>
  </g>
  <!-- Motif Content -->
  <g filter="url(#motifShadow)">
    
  <!-- Rolled Parchment Scroll -->
  <rect x="76" y="76" width="82" height="102" rx="10" fill="#fef3c7" stroke="#92400e" stroke-width="3"/>
  <rect x="70" y="72" width="94" height="16" rx="8" fill="url(#rimGrad)" stroke="#78350f" stroke-width="2"/>
  <rect x="70" y="168" width="94" height="16" rx="8" fill="url(#rimGrad)" stroke="#78350f" stroke-width="2"/>
  <line x1="94" y1="106" x2="140" y2="106" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
  <line x1="94" y1="122" x2="136" y2="122" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
  <line x1="94" y1="138" x2="124" y2="138" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
  <!-- Copper-Gold Feather Quill -->
  <path d="M188 70 C176 74, 152 96, 138 138 L130 156 L146 144 C174 126, 192 98, 188 70 Z" fill="url(#rimGrad)" stroke="#78350f" stroke-width="2"/>
  <line x1="130" y1="156" x2="184" y2="74" stroke="#fef3c7" stroke-width="2.5"/>

  </g>
  <!-- Gloss Specular Overlay -->
  <ellipse cx="128" cy="84" rx="68" ry="40" fill="url(#topSheen)"/>
</svg>