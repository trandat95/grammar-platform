<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 170" role="img" aria-label="Gói Free - Giới hạn 4 câu mỗi bài tập">
  <defs>
    <linearGradient id="fBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="fBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="fLock" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="fSh" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="360" height="170" rx="16" fill="url(#fBg)" stroke="#cbd5e1" stroke-width="1.2"/>
  <circle cx="62" cy="85" r="46" fill="#cbd5e1" opacity="0.28"/>
  <circle cx="298" cy="85" r="42" fill="#bfdbfe" opacity="0.32"/>

  <!-- Left: Locked Feature Mini Card (Slate/Blue) -->
  <g filter="url(#fSh)">
    <rect x="24" y="40" width="80" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8" stroke-dasharray="5 4"/>
    <path d="M52 74 V64 A12 12 0 0 1 76 64 V74" fill="none" stroke="#64748b" stroke-width="4.5" stroke-linecap="round"/>
    <rect x="46" y="72" width="36" height="28" rx="6" fill="url(#fLock)"/>
    <circle cx="64" cy="84" r="3.5" fill="#f8fafc"/>
    <rect x="62.5" y="86" width="3" height="7" rx="1.5" fill="#f8fafc"/>
    <text x="64" y="117" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" fill="#64748b">KHÓA NÂNG CAO</text>
  </g>

  <!-- Center: Starter Exercise Card with Explicit 4 CÂU / BÀI Quota -->
  <g filter="url(#fSh)">
    <rect x="118" y="24" width="124" height="122" rx="14" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="130" y="36" width="100" height="18" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="180" y="48.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="9.5" fill="#1e3a8a">GÓI CƠ BẢN</text>

    <!-- 4-Question Active Blocks + Locked Remaining Slots -->
    <rect x="132" y="64" width="18" height="10" rx="4" fill="url(#fBlue)"/>
    <rect x="154" y="64" width="18" height="10" rx="4" fill="url(#fBlue)"/>
    <rect x="176" y="64" width="18" height="10" rx="4" fill="url(#fBlue)"/>
    <rect x="198" y="64" width="18" height="10" rx="4" fill="url(#fBlue)"/>

    <rect x="132" y="80" width="96" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="132" y="92" width="76" height="7" rx="3.5" fill="#e2e8f0"/>

    <!-- Explicit 4 CÂU / BÀI Pill -->
    <rect x="130" y="110" width="100" height="24" rx="12" fill="url(#fBlue)"/>
    <text x="180" y="125.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#ffffff">4 CÂU / BÀI</text>
  </g>

  <!-- Right: Daily Cap Gauge (Slate/Blue) -->
  <g filter="url(#fSh)">
    <rect x="256" y="40" width="80" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
    <circle cx="296" cy="76" r="21" fill="none" stroke="#e2e8f0" stroke-width="6"/>
    <circle cx="296" cy="76" r="21" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" stroke-dasharray="38 132" transform="rotate(-90 296 76)"/>
    <text x="296" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#1e3a8a">4/4</text>
    <text x="296" y="117" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" fill="#475569">GIỚI HẠN LƯỢT</text>
  </g>
</svg>
