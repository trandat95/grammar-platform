<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 170" role="img" aria-label="Thành viên VIP - Mở khóa toàn bộ 2,939 câu hỏi, AI Coach và Radar 12 chuyên đề">
  <defs>
    <linearGradient id="vBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <radialGradient id="vHalo" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#facc15" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="vCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="vEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="vSh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="360" height="170" rx="16" fill="url(#vBg)"/>
  <circle cx="180" cy="85" r="120" fill="url(#vHalo)"/>

  <!-- Sparkle stars -->
  <g fill="#fef08a">
    <path d="M44 34 L46 41 L53 43 L46 45 L44 52 L42 45 L35 43 L42 41 Z"/>
    <path d="M316 30 L318 36 L324 38 L318 40 L316 46 L314 40 L308 38 L314 36 Z"/>
    <circle cx="94" cy="28" r="2.2" fill="#67e8f9"/>
    <circle cx="268" cy="142" r="2.5" fill="#67e8f9"/>
  </g>

  <!-- Left Card: Radar 12 Chuyên Đề Mini Chart -->
  <g filter="url(#vSh)">
    <rect x="26" y="42" width="84" height="86" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
    <polygon points="68,54 90,67 90,93 68,106 46,93 46,67" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
    <polygon points="68,60 85,71 82,91 68,99 53,88 55,70" fill="#22d3ee" fill-opacity="0.38" stroke="#67e8f9" stroke-width="2"/>
    <text x="68" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="10" fill="#e0f2fe">RADAR 12</text>
  </g>

  <!-- Center Hero: Glowing Golden VIP Crown & Infinity Shield -->
  <g filter="url(#vSh)">
    <polygon points="180,18 228,38 222,102 180,136 138,102 132,38" fill="#0f172a" stroke="url(#vGold)" stroke-width="4"/>
    <!-- Royal Crown -->
    <path d="M150 72 L158 46 L172 60 L180 40 L188 60 L202 46 L210 72 Z" fill="url(#vGold)" stroke="#fef9c3" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="150" y="74" width="60" height="8" rx="4" fill="url(#vGold)"/>
    <!-- Faceted Cyan Diamond Core -->
    <polygon points="180,86 196,100 180,118 164,100" fill="url(#vCyan)" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Unlimited Ribbon Pill -->
    <rect x="128" y="128" width="104" height="24" rx="12" fill="url(#vEmerald)" stroke="#a7f3d0" stroke-width="1.8"/>
    <text x="180" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="11.5" fill="#ffffff">VIP KHÔNG GIỚI HẠN</text>
  </g>

  <!-- Right Card: AI Coach + 2,939 Questions Spark -->
  <g filter="url(#vSh)">
    <rect x="250" y="42" width="84" height="86" rx="13" fill="#1e293b" stroke="#facc15" stroke-width="1.8"/>
    <circle cx="292" cy="76" r="20" fill="url(#vCyan)" opacity="0.25"/>
    <path d="M292 56 L297 70 L311 75 L297 80 L292 94 L287 80 L273 75 L287 70 Z" fill="url(#vGold)"/>
    <text x="292" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="12" fill="#fef08a">AI ∞</text>
    <text x="292" y="123" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="9" fill="#cbd5e1">2,939 CÂU</text>
  </g>
</svg>