<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 170" role="img" aria-label="Thành viên VIP - Mở khóa 2,939 câu hỏi và TOEIC 2026">
  <defs>
    <linearGradient id="vBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090f1e"/>
      <stop offset="52%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="vHalo" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.38"/>
      <stop offset="58%" stop-color="#f59e0b" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="vCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="vEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="vSh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="360" height="170" rx="16" fill="url(#vBg)" stroke="#2563eb" stroke-opacity="0.45" stroke-width="1.2"/>
  <circle cx="180" cy="85" r="124" fill="url(#vHalo)"/>

  <!-- Sparkle stars -->
  <g fill="#fde68a">
    <path d="M40 28 L42 34 L48 36 L42 38 L40 44 L38 38 L32 36 L38 34 Z"/>
    <path d="M320 26 L322 32 L328 34 L322 36 L320 42 L318 36 L312 34 L318 32 Z"/>
    <circle cx="98" cy="24" r="2" fill="#22d3ee"/>
    <circle cx="264" cy="144" r="2.2" fill="#22d3ee"/>
  </g>

  <!-- Left Card: Radar 12 Chuyên Đề Mini Chart -->
  <g filter="url(#vSh)">
    <rect x="20" y="38" width="88" height="94" rx="13" fill="#0f172a" stroke="#06b6d4" stroke-width="1.6"/>
    <polygon points="64,50 86,63 86,89 64,102 42,89 42,63" fill="none" stroke="#38bdf8" stroke-width="1.3" opacity="0.48"/>
    <polygon points="64,57 81,67 78,86 64,95 49,84 51,66" fill="#06b6d4" fill-opacity="0.34" stroke="#67e8f9" stroke-width="1.8"/>
    <text x="64" y="120" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="9.5" fill="#e0f2fe">RADAR 12</text>
  </g>

  <!-- Center Hero: Royal Navy + Amber Gold VIP Shield and Cyan Diamond -->
  <g filter="url(#vSh)">
    <polygon points="180,16 226,35 220,98 180,130 140,98 134,35" fill="#0f172a" stroke="url(#vGold)" stroke-width="3.5"/>
    <!-- Royal Crown -->
    <path d="M152 68 L159 44 L172 57 L180 38 L188 57 L201 44 L208 68 Z" fill="url(#vGold)" stroke="#fef9c3" stroke-width="1.3" stroke-linejoin="round"/>
    <rect x="152" y="70" width="56" height="7" rx="3.5" fill="url(#vGold)"/>
    <!-- Faceted Cyan Diamond Core -->
    <polygon points="180,82 195,96 180,114 165,96" fill="url(#vCyan)" stroke="#ffffff" stroke-width="1.4"/>
    <!-- Unlimited Ribbon Pill -->
    <rect x="122" y="126" width="116" height="24" rx="12" fill="url(#vEmerald)" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="180" y="141.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10.5" fill="#ffffff">VIP KHÔNG GIỚI HẠN</text>
  </g>

  <!-- Right Card: 2,939 CÂU • TOEIC 2026 -->
  <g filter="url(#vSh)">
    <rect x="248" y="38" width="92" height="94" rx="13" fill="#0f172a" stroke="#f59e0b" stroke-width="1.6"/>
    <circle cx="294" cy="68" r="18" fill="#1e3a8a" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.2"/>
    <path d="M294 53 L298 64 L309 68 L298 72 L294 83 L290 72 L279 68 L290 64 Z" fill="url(#vGold)"/>
    <text x="294" y="104" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11.5" fill="#fde68a">2,939 CÂU</text>
    <rect x="258" y="111" width="72" height="14" rx="7" fill="#1e3a8a" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1"/>
    <text x="294" y="121" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="8.5" fill="#67e8f9">TOEIC 2026</text>
  </g>
</svg>
