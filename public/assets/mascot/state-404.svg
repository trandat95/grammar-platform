<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-label="404 - Cú Tri Thức đang tìm trang bị thiếu">
  <defs>
    <linearGradient id="owlNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="owlCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cffafe" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.24"/>
    </linearGradient>
  </defs>

  <!-- Soft translucent aura safe on Light (#FFF) and Dark (#09090B) -->
  <circle cx="120" cy="126" r="98" fill="#06b6d4" fill-opacity="0.10"/>
  <circle cx="120" cy="126" r="76" fill="none" stroke="#2563eb" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="5 6"/>

  <!-- Missing Page Silhouette (Left) -->
  <g transform="translate(26, 56) rotate(-8 34 48)">
    <path d="M0 10 C0 4.5, 4.5 0, 10 0 H46 L68 22 V86 C68 91.5, 63.5 96, 58 96 H10 C4.5 96, 0 91.5, 0 86 Z" fill="url(#pageGrad)" stroke="#64748b" stroke-width="2.5"/>
    <path d="M46 0 V16 C46 19.3, 48.7 22, 52 22 H68 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="2" stroke-linejoin="round"/>
    <!-- Dashed missing lines and question mark -->
    <line x1="14" y1="38" x2="48" y2="38" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="14" y1="50" x2="54" y2="50" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="6 5"/>
    <text x="34" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#1e3a8a">?</text>
  </g>

  <!-- Geometric Scholar Owl Silhouette (Right/Center) -->
  <g transform="translate(142, 128)">
    <!-- Ground shadow -->
    <ellipse cx="0" cy="70" rx="44" ry="8" fill="#0f172a" fill-opacity="0.22"/>

    <!-- Feet -->
    <path d="M-18 62 L-22 69 M-12 62 L-12 70 M-6 62 L-3 69" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M18 62 L22 69 M12 62 L12 70 M6 62 L3 69" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Body (1.15:1 Head-to-Body Scholar Owl proportions) -->
    <ellipse cx="0" cy="24" rx="38" ry="40" fill="url(#owlNavy)" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="2"/>
    <!-- Cream Belly Shield -->
    <ellipse cx="0" cy="28" rx="24" ry="28" fill="#f0f9ff"/>
    <path d="M-10 22 Q-5 26 0 22 Q5 26 10 22" fill="none" stroke="#bae6fd" stroke-width="2" stroke-linecap="round"/>
    <path d="M-8 34 Q-4 38 0 34 Q4 38 8 34" fill="none" stroke="#bae6fd" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Wing (Resting) -->
    <path d="M32 6 C46 16, 46 42, 30 52 C26 42, 26 20, 32 6 Z" fill="url(#owlCyan)"/>

    <!-- Head (Slightly larger, inquisitive tilt) -->
    <g transform="translate(-2, -30) rotate(-5)">
      <!-- Ear Tufts / Brow Horns -->
      <path d="M-36 -26 L-44 -44 L-18 -34 Z" fill="url(#owlCyan)"/>
      <path d="M36 -26 L44 -44 L18 -34 Z" fill="url(#owlCyan)"/>
      <!-- Head Circle/Oval -->
      <ellipse cx="0" cy="-6" rx="44" ry="38" fill="url(#owlNavy)" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="2"/>
      <!-- Cyan Face Mask -->
      <path d="M-34 -8 C-34 -24, -10 -28, 0 -14 C10 -28, 34 -24, 34 -8 C34 12, 16 20, 0 18 C-16 20, -34 12, -34 -8 Z" fill="#0891b2"/>

      <!-- Big Expressive Eyes -->
      <circle cx="-16" cy="-6" r="13" fill="#ffffff"/>
      <circle cx="16" cy="-6" r="13" fill="#ffffff"/>
      <circle cx="-18" cy="-5" r="7" fill="#0f172a"/>
      <circle cx="14" cy="-5" r="7" fill="#0f172a"/>
      <circle cx="-20" cy="-8" r="2.6" fill="#ffffff"/>
      <circle cx="12" cy="-8" r="2.6" fill="#ffffff"/>

      <!-- Signature Scholar Cyan Glasses -->
      <circle cx="-16" cy="-6" r="15.5" fill="none" stroke="#67e8f9" stroke-width="3.2"/>
      <circle cx="16" cy="-6" r="15.5" fill="none" stroke="#67e8f9" stroke-width="3.2"/>
      <path d="M-1 -6 H1" stroke="#67e8f9" stroke-width="3.2" stroke-linecap="round"/>

      <!-- Amber Beak -->
      <polygon points="0,-1 6,7 0,13 -6,7" fill="#f59e0b" stroke="#fef3c7" stroke-width="1"/>

      <!-- Amber Spark Crest -->
      <path d="M0 -42 L2.5 -35 L9.5 -32.5 L2.5 -30 L0 -23 L-2.5 -30 L-9.5 -32.5 L-2.5 -35 Z" fill="#fbbf24"/>
    </g>

    <!-- Left Wing Holding Magnifying Glass -->
    <path d="M-30 4 C-48 8, -54 28, -42 40 C-30 34, -24 18, -30 4 Z" fill="url(#owlCyan)"/>
  </g>

  <!-- Magnifying Glass inspecting Missing Page -->
  <g transform="translate(88, 134) rotate(-32)">
    <rect x="-4" y="22" width="8" height="28" rx="4" fill="#1e3a8a" stroke="#67e8f9" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="22" fill="url(#lensGrad)" stroke="#06b6d4" stroke-width="4.5"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.5"/>
    <path d="M-10 -8 A13 13 0 0 1 4 -12" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Subtle Sparkles -->
  <path d="M204 42 L206.5 48.5 L213 51 L206.5 53.5 L204 60 L201.5 53.5 L195 51 L201.5 48.5 Z" fill="#f59e0b"/>
  <circle cx="38" cy="186" r="3.5" fill="#22d3ee"/>
</svg>
