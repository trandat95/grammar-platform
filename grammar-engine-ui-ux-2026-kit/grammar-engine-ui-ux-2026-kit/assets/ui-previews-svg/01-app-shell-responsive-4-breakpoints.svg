  <rect x="52" y="186" width="175" height="150" rx="8" fill="#18181B" stroke="#27272A"/>
  <text x="64" y="208" font-family="Geist Mono, monospace" font-size="10.5" font-weight="700" fill="#38BDF8">SIDEBAR (280px Collapsible)</text>
  <text x="64" y="228" font-family="Geist, sans-serif" font-size="10" fill="#A1A1AA">• Tìm kiếm nhanh [⌘K]</text>
  <text x="64" y="246" font-family="Geist, sans-serif" font-size="10" fill="#FAFAFA">01. Các thì (13 bài) [Expanded]</text>
  <text x="64" y="264" font-family="Geist, sans-serif" font-size="10" fill="#34D399">  ├─ 1.1 Present Simple ✓</text>
  <text x="64" y="282" font-family="Geist, sans-serif" font-size="10" fill="#38BDF8">  ├─ 1.2 Present Continuous ●</text>
  <text x="64" y="300" font-family="Geist, sans-serif" font-size="10" fill="#A1A1AA">02. Sự phối hợp các thì (2 bài)</text>
  <text x="64" y="318" font-family="Geist, sans-serif" font-size="10" fill="#A1A1AA">03. Mệnh đề &amp; Cụm từ (9 bài)</text>

  <rect x="239" y="186" width="521" height="150" rx="8" fill="#18181B" stroke="#27272A"/>
