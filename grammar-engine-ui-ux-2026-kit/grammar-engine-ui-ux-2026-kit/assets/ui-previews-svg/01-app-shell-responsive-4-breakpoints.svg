  <text x="1112" y="608" text-anchor="middle" font-family="Geist, sans-serif" font-size="9.5" fill="#FBBF24">VIP</text>

  <!-- Tablet 768px & Key Metrics Box -->
  <rect x="36" y="368" width="740" height="276" rx="12" fill="#121215" stroke="#272733" stroke-width="1.5"/>
  <text x="52" y="396" font-family="Geist Mono, monospace" font-size="12" font-weight="700" fill="#34D399">3. BẢNG ĐỐI CHIẾU GIẢI PHÁP TÁI CẤU TRÚC (SOLVING AUDIT P0 / P1 / P2)</text>
  <text x="52" y="424" font-family="Geist, sans-serif" font-size="11.5" fill="#FAFAFA">• [P0] Responsive 4 Breakpoints: Bổ sung đầy đủ @media (max-width: 1280px / 1024px / 768px / 480px) trong design-system-2026.css.</text>
  <text x="52" y="448" font-family="Geist, sans-serif" font-size="11.5" fill="#FAFAFA">• [P0] Header 16 phần tử: Gộp thành 5 Hub chính + Command Palette [⌘K] + Quick Tools Popover; Mobile dùng Bottom Nav 5 nút (44×44px).</text>
  <text x="52" y="472" font-family="Geist, sans-serif" font-size="11.5" fill="#FAFAFA">• [P0] Sidebar 320px cứng: Chuyển thành Collapsible Sidebar 280px (Desktop) và Slide-over Drawer + Sticky Pill Bar (Tablet/Mobile).</text>
  <text x="52" y="496" font-family="Geist, sans-serif" font-size="11.5" fill="#FAFAFA">• [P1] 2,205 mã HEX cứng: Chuẩn hóa sang biến CSS var(--ds-*) cho cả 8 sơ đồ GrammarVisualization, Diagnostic &amp; StructuredExplanation.</text>
  <text x="52" y="520" font-family="Geist, sans-serif" font-size="11.5" fill="#FAFAFA">• [P1] Legacy Modals (#auth-modal, #vocab-modal, #dict-popup): Bọc trong FocusTrapModal có quản lý Esc, aria-modal và Bottom Sheet Mobile.</text>
  <text x="52" y="544" font-family="Geist, sans-serif" font-size="11.5" fill="#FAFAFA">• [P1] Quá tải dọc Dashboard: Tách thành 2 Sub-view Bento (Zone A: Hành động hôm nay &amp; SM-2 Above-the-fold | Zone B: Radar 12 trục &amp; 12 Chương).</text>
  <text x="52" y="568" font-family="Geist, sans-serif" font-size="11.5" fill="#FAFAFA">• [P2] Đồng bộ Icon &amp; Input: Thay toàn bộ Emoji OS bằng 42 SVG Icons chuẩn 24×24px; hỗ trợ đầy đủ cả Text Input (2,939 câu) &amp; MCQ Card.</text>
  <rect x="52" y="586" width="708" height="40" rx="8" fill="#064E3B" fill-opacity="0.35" stroke="#047857"/>
  <text x="406" y="611" text-anchor="middle" font-family="Geist Mono, monospace" font-size="11.5" font-weight="700" fill="#34D399">WCAG 2.2 AA VERIFIED (28/28 PAIRS &gt;= 4.5:1) • FTC ANTI-DARK-PATTERN COMPLIANT • ZERO CLS SKELETON</text>
</svg>
