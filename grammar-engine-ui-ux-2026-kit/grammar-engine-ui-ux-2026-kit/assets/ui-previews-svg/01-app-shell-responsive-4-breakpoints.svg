  <text x="268" y="262" font-family="Geist Mono, monospace" font-size="10" fill="#38BDF8">S + am/is/are + V-ing (Max 165 chars)</text>
  <text x="268" y="282" font-family="Geist, sans-serif" font-size="10" fill="#A1A1AA">Tự động cuộn ngang mềm khi công thức dài</text>
  <rect x="504" y="220" width="240" height="100" rx="8" fill="#111115" stroke="#272733"/>
  <text x="518" y="242" font-family="Geist, sans-serif" font-size="11" font-weight="700" fill="#FAFAFA">8 Mô hình Trực quan Hóa Tương tác</text>
  <text x="518" y="262" font-family="Geist, sans-serif" font-size="10" fill="#34D399">Timeline 13 Thì • Cây Điều Kiện • Bị Động</text>
  <text x="518" y="282" font-family="Geist, sans-serif" font-size="10" fill="#A1A1AA">100% Semantic CSS Tokens (0 Hardcoded HEX)</text>

  <!-- Mobile 375px Artboard -->
  <rect x="804" y="92" width="360" height="552" rx="24" fill="#121215" stroke="#38BDF8" stroke-width="2"/>
  <text x="828" y="122" font-family="Geist Mono, monospace" font-size="12" font-weight="700" fill="#38BDF8">2. MOBILE STANDARD (375×812px)</text>
