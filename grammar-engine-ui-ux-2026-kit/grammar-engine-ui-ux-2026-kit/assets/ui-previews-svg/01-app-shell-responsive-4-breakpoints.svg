  <text x="412" y="157" text-anchor="middle" font-family="Geist, sans-serif" font-size="10.5" font-weight="600" fill="#D4D4D8">Luyện tập (50/30/20)</text>
  <text x="502" y="157" text-anchor="middle" font-family="Geist, sans-serif" font-size="10.5" font-weight="600" fill="#D4D4D8">Thành tích</text>
