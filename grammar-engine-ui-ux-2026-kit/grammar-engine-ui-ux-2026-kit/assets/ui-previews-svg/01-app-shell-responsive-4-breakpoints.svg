<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" fill="none">
  <rect width="1200" height="680" rx="16" fill="#09090B"/>
  <text x="36" y="42" font-family="Geist, Inter, sans-serif" font-size="20" font-weight="800" fill="#FAFAFA">KIẾN TRÚC APP SHELL 2026 — GIẢI QUYẾT TRIỆT ĐỂ LỖI P0 OVERFLOW TRÊN 4 BREAKPOINTS</text>
  <text x="36" y="66" font-family="Geist, Inter, sans-serif" font-size="13" fill="#A1A1AA">Gộp 16 phần tử trên Header cũ thành 5 Hub điều hướng chuẩn nhận thức + Cụm Quick Tools gọn + Bottom Tab Bar trên Mobile 375px</text>

  <!-- Desktop 1440px -->
  <rect x="36" y="92" width="740" height="260" rx="12" fill="#121215" stroke="#272733" stroke-width="1.5"/>
  <text x="52" y="118" font-family="Geist Mono, monospace" font-size="12" font-weight="700" fill="#38BDF8">1. DESKTOP WIDE (1440×900px) &amp; LAPTOP (1280×800px) — 5-HUB STICKY HEADER (56px)</text>
  <!-- Header bar -->
  <rect x="52" y="132" width="708" height="42" rx="8" fill="#18181B" stroke="#27272A"/>
  <rect x="62" y="141" width="24" height="24" rx="6" fill="#2563EB"/>
  <text x="74" y="157" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">G</text>
  <text x="94" y="157" font-family="Geist, sans-serif" font-size="12" font-weight="700" fill="#FAFAFA">Grammar Engine</text>
  <!-- 5 Hubs -->
  <rect x="200" y="139" width="68" height="28" rx="6" fill="#2563EB"/>
  <text x="234" y="157" text-anchor="middle" font-family="Geist, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">Tổng quan</text>
