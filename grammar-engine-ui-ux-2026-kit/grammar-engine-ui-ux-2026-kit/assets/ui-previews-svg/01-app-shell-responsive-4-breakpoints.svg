  <!-- Mobile Chapter Sticky Selector (Thay thế Sidebar 320px cứng) -->
  <rect x="824" y="186" width="320" height="36" rx="8" fill="#0C4A6E" fill-opacity="0.35" stroke="#0284C7"/>
  <text x="838" y="208" font-family="Geist, sans-serif" font-size="11" font-weight="700" fill="#38BDF8">Chương 01: Các thì (1.2 Present Cont.) ▾</text>

  <!-- Mobile Hero Card -->
  <rect x="824" y="232" width="320" height="110" rx="12" fill="#18181B" stroke="#27272A"/>
  <text x="840" y="256" font-family="Geist, sans-serif" font-size="12" font-weight="700" fill="#FAFAFA">Hành động Hôm nay (Above-the-Fold)</text>
  <text x="840" y="276" font-family="Geist, sans-serif" font-size="10.5" fill="#34D399">• 8 thẻ SM-2 đến hạn ôn tập (Knowledge Graph)</text>
  <text x="840" y="294" font-family="Geist, sans-serif" font-size="10.5" fill="#A1A1AA">• Mục tiêu ngày: 12/20 câu (60%)</text>
  <rect x="840" y="306" width="288" height="24" rx="6" fill="#2563EB"/>
  <text x="984" y="322" text-anchor="middle" font-family="Geist, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">Ôn tập SM-2 ngay (8 thẻ) ➔</text>

  <!-- Mobile Question Card Preview -->
  <rect x="824" y="352" width="320" height="214" rx="12" fill="#18181B" stroke="#27272A"/>
  <text x="840" y="376" font-family="Geist Mono, monospace" font-size="10" font-weight="700" fill="#38BDF8">CÂU 04/10 • SENTENCE TRANSFORMATION</text>
  <text x="840" y="398" font-family="Geist, sans-serif" font-size="11" fill="#FAFAFA">Although it rained heavily, they went out.</text>
  <rect x="840" y="410" width="288" height="26" rx="6" fill="#451A03" stroke="#B45309"/>
  <text x="850" y="427" font-family="Geist Mono, monospace" font-size="10" font-weight="700" fill="#FBBF24">BẮT ĐẦU VỚI: In spite of...</text>
  <rect x="840" y="446" width="288" height="36" rx="6" fill="#111115" stroke="#38BDF8"/>
  <text x="852" y="468" font-family="Geist, sans-serif" font-size="11" fill="#FAFAFA">In spite of the heavy rain, they went out.</text>
  <text x="840" y="504" font-family="Geist, sans-serif" font-size="10" font-weight="700" fill="#34D399">✓ Chính xác (+15 XP) • Xem Lời giải 5 Bước ▾</text>
  <text x="840" y="524" font-family="Geist, sans-serif" font-size="10" fill="#A1A1AA">Click bất kỳ từ nào để mở #dict-popup (Bottom Sheet)</text>

  <!-- Mobile Bottom Navigation Bar (5 Tabs, Touch Target >= 44x44px) -->
  <rect x="824" y="578" width="320" height="52" rx="12" fill="#18181B" stroke="#272733"/>
  <text x="856" y="608" text-anchor="middle" font-family="Geist, sans-serif" font-size="9.5" font-weight="700" fill="#38BDF8">Tổng quan</text>
  <text x="920" y="608" text-anchor="middle" font-family="Geist, sans-serif" font-size="9.5" fill="#A1A1AA">12 Chuyên đề</text>
  <text x="984" y="608" text-anchor="middle" font-family="Geist, sans-serif" font-size="9.5" fill="#A1A1AA">Luyện Quiz</text>
