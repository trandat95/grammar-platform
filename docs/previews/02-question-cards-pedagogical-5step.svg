  <text x="450" y="324" text-anchor="middle" font-family="Geist, sans-serif" font-size="10" font-weight="700" fill="#0F172A">Basic | Intermediate | Advanced</text>

  <text x="72" y="354" font-family="Geist, sans-serif" font-size="11.5" font-weight="700" fill="#2563EB">1. Dấu hiệu &amp; Ngữ cảnh (Signal):</text>
  <text x="72" y="372" font-family="Geist, sans-serif" font-size="11" fill="#334155">Trạng từ phủ định "Never before" đặt đầu câu để nhấn mạnh trải nghiệm chưa từng có.</text>

  <text x="72" y="398" font-family="Geist, sans-serif" font-size="11.5" font-weight="700" fill="#047857">2. Quy tắc &amp; Công thức (Rule):</text>
  <rect x="72" y="406" width="478" height="26" rx="4" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="82" y="423" font-family="Geist Mono, monospace" font-size="11" font-weight="700" fill="#047857">Never (before) + had + S + V3/ed + such + (a/an) + Adj + N</text>

  <text x="72" y="452" font-family="Geist, sans-serif" font-size="11.5" font-weight="700" fill="#0F172A">3. Dịch nghĩa &amp; Từ vựng: <tspan font-weight="500" fill="#334155">Chưa bao giờ trước đây Minh đọc một cuốn sách...</tspan></text>
  <text x="72" y="478" font-family="Geist, sans-serif" font-size="11.5" font-weight="700" fill="#DC2626">4. Bẫy hay gặp (Common Mistakes): <tspan font-weight="500" fill="#334155">Quên đảo trợ động từ "had" lên trước chủ ngữ Minh.</tspan></text>
  <text x="72" y="504" font-family="Geist, sans-serif" font-size="11.5" font-weight="700" fill="#B45309">5. Chiến thuật thi cử (Exam Tips): <tspan font-weight="500" fill="#334155">Kiểm tra lùi thì (have read ➔ had read) + đảo ngữ.</tspan></text>

  <text x="72" y="568" font-family="Geist, sans-serif" font-size="10.5" font-weight="600" fill="#475569">🚩 Báo lỗi nội dung sư phạm</text>
